# Local Postgres for development: `npm run db:up`. Same engine major as Supabase.
name: natural-shop

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: natural_shop
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d natural_shop"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
